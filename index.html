<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Tech Ops SaaS Spend · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e6e8ec;
    --border-strong: #d4d7dd;
    --ink: #1a1d26;
    --ink2: #5b6472;
    --ink3: #8b93a1;
    --cogs: #3366d6;
    --cogs-soft: #e8eefb;
    --noncogs: #0e9f6e;
    --noncogs-soft: #e3f5ee;
    --amber: #d97706;
    --amber-soft: #fdf3e7;
    --red: #dc3545;
    --red-soft: #fbeaec;
    --green: #0e9f6e;
    --green-soft: #e3f5ee;
    --purple: #7c5cdb;
    --purple-soft: #efeafb;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 4px 12px rgba(16,24,40,.06), 0 2px 4px rgba(16,24,40,.04);
    --r: 14px;
    --sans: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Archivo', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1;
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* ── HEADER ───────────────────────────────────── */
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 20px 36px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .brand h1 {
    font-family: var(--display); font-size: 19px; font-weight: 700;
    letter-spacing: -0.3px; color: var(--ink); display: flex; align-items: center; gap: 9px;
  }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cogs); display: inline-block; }
  .brand .sub { font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-top: 3px; letter-spacing: 0; }
  #month-tabs { display: flex; gap: 3px; background: var(--bg); padding: 3px; border-radius: 9px; border: 1px solid var(--border); }
  .month-tab {
    padding: 6px 18px; border-radius: 7px; cursor: pointer; border: none; background: transparent;
    font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink2); transition: all .15s;
  }
  .month-tab:hover { color: var(--ink); }
  .month-tab.active { background: var(--card); color: var(--cogs); box-shadow: var(--shadow); font-weight: 600; }

  main { padding: 28px 36px 48px; max-width: 1340px; margin: 0 auto; }

  .row { display: grid; gap: 16px; margin-bottom: 16px; }
  .row.kpis { grid-template-columns: repeat(4, 1fr); }
  .row.mid { grid-template-columns: 1.6fr 1fr 1fr; }
  .row.low { grid-template-columns: 1fr 1fr; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
    padding: 22px; box-shadow: var(--shadow);
  }
  .card-head {
    font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: 0.3px;
    text-transform: uppercase; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
  }

  /* ── KPI ───────────────────────────────────── */
  .kpi-label { font-size: 12px; color: var(--ink3); font-weight: 500; letter-spacing: 0.2px; margin-bottom: 10px; }
  .kpi-value { font-family: var(--display); font-size: 32px; font-weight: 700; letter-spacing: -1px; line-height: 1; color: var(--ink); }
  .kpi-value .num { font-family: var(--display); }
  .kpi-sub { font-family: var(--mono); font-size: 12px; color: var(--ink3); margin-top: 8px; }
  .kpi-foot { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
  .chip {
    font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.up { background: var(--green-soft); color: var(--green); }
  .chip.down { background: var(--red-soft); color: var(--red); }
  .chip.flat { background: var(--bg); color: var(--ink3); }
  .kpi-meter { height: 6px; border-radius: 4px; background: var(--bg); overflow: hidden; margin-top: 14px; }
  .kpi-meter > span { display: block; height: 100%; border-radius: 4px; }

  /* ── CHART ───────────────────────────────────── */
  #trend-wrap { height: 250px; position: relative; }

  /* ── DONUT ───────────────────────────────────── */
  #donut-area { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #donut-svg { width: 150px; height: 150px; }
  .legend { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink); }
  .legend-item .sw { width: 11px; height: 11px; border-radius: 3px; }
  .legend-item .val { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink2); }

  /* ── DEPT BARS ───────────────────────────────────── */
  .dept-row { margin-bottom: 13px; }
  .dept-row:last-child { margin-bottom: 0; }
  .dept-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .dept-top .nm { color: var(--ink); font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dept-top .amt { font-family: var(--mono); color: var(--ink2); }
  .dept-track { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .dept-fill { height: 100%; border-radius: 4px; background: var(--cogs); }

  /* ── TOP APPS ───────────────────────────────────── */
  .ta-head, .ta-row {
    display: grid; grid-template-columns: 22px 1fr 76px 104px 90px 64px; align-items: center; gap: 10px;
  }
  .ta-head { font-size: 11px; color: var(--ink3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .ta-row { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ta-row:last-child { border-bottom: none; }
  .ta-rank { font-family: var(--mono); font-size: 12px; color: var(--ink3); text-align: right; }
  .ta-name { font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; letter-spacing: 0.2px; }
  .pill.cogs { background: var(--cogs-soft); color: var(--cogs); }
  .pill.nc { background: var(--noncogs-soft); color: var(--noncogs); }
  .pill.je { background: var(--purple-soft); color: var(--purple); margin-left: 3px; }
  .ta-amt { font-family: var(--mono); font-size: 13px; text-align: right; color: var(--ink); }
  .ta-bar-track { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .ta-bar { height: 100%; background: var(--cogs); border-radius: 3px; }
  .ta-mom { font-family: var(--mono); font-size: 12px; text-align: right; }
  .mom-up { color: var(--green); }
  .mom-down { color: var(--red); }
  .mom-flat { color: var(--ink3); }

  /* ── MOVERS ───────────────────────────────────── */
  .mv { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; background: var(--bg); margin-bottom: 8px; }
  .mv:last-child { margin-bottom: 0; }
  .mv-name { font-weight: 600; font-size: 13px; flex: 1; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mv-flow { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
  .mv-pct { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
  .mv-pct.up { background: var(--green-soft); color: var(--green); }
  .mv-pct.down { background: var(--red-soft); color: var(--red); }
  .mv-pct.new { background: var(--amber-soft); color: var(--amber); }

  /* ── TABLE ───────────────────────────────────── */
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .search {
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 8px 14px;
    font-family: var(--sans); font-size: 13px; color: var(--ink); outline: none; width: 220px;
  }
  .search:focus { border-color: var(--cogs); background: var(--card); }
  .fbtn {
    padding: 7px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink2); cursor: pointer; transition: all .15s;
  }
  .fbtn:hover { border-color: var(--border-strong); color: var(--ink); }
  .fbtn.active { background: var(--cogs); border-color: var(--cogs); color: #fff; }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 11px 14px; background: var(--bg); color: var(--ink2);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
    cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  thead th:hover { color: var(--cogs); }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--ink); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafbfc; }
  td.num-cell { font-family: var(--mono); text-align: right; }
  .ytd-cell { font-family: var(--mono); text-align: right; font-weight: 600; color: var(--cogs); }
  .dept-cell { font-size: 12px; color: var(--ink2); }

  footer { padding: 22px 36px; color: var(--ink3); font-family: var(--mono); font-size: 11px; border-top: 1px solid var(--border); background: var(--card); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span class="dot"></span> Tech Ops · SaaS Spend</h1>
    <div class="sub" id="updated"></div>
  </div>
  <div id="month-tabs"></div>
</header>

<main>
  <div class="row kpis" id="kpis"></div>

  <div class="row mid">
    <div class="card">
      <div class="card-head">Monthly Spend Trend</div>
      <div id="trend-wrap"><canvas id="trend"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head" id="donut-title">COGS Split</div>
      <div id="donut-area"></div>
    </div>
    <div class="card">
      <div class="card-head" id="dept-title">Spend by Department</div>
      <div id="dept"></div>
    </div>
  </div>

  <div class="row low">
    <div class="card">
      <div class="card-head" id="top-title">Top Apps</div>
      <div id="top-apps"></div>
    </div>
    <div class="card">
      <div class="card-head">Month-over-Month Movers · Mar → Apr</div>
      <div id="movers"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">All Apps</div>
    <div class="toolbar">
      <input class="search" id="search" placeholder="Search apps…">
      <button class="fbtn active" data-f="all" onclick="setFilter('all')">All</button>
      <button class="fbtn" data-f="cogs" onclick="setFilter('cogs')">COGS</button>
      <button class="fbtn" data-f="noncogs" onclick="setFilter('noncogs')">Non-COGS</button>
      <button class="fbtn" data-f="journaled" onclick="setFilter('journaled')">Journaled</button>
      <span id="count" style="margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)"></span>
    </div>
    <div class="tbl-wrap">
      <table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table>
    </div>
  </div>
</main>

<footer id="footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
let DATA = null, activeMonth = 3, activeFilter = 'all', sortKey = 'Apr', sortAsc = false, tableFilter = '';

const COL = { cogs: '#3366d6', noncogs: '#0e9f6e', amber: '#d97706', ink2: '#5b6472', grid: '#eceef1' };

async function init() {
  const res = await fetch('data.json?v=' + Date.now());
  DATA = await res.json();
  activeMonth = DATA.meta.monthLabels.length - 1;
  renderAll();
}
const ML = () => DATA.meta.monthLabels;

function fmt(n) {
  if (Math.abs(n) >= 1000000) return '$' + (n/1000000).toFixed(2) + 'M';
  if (Math.abs(n) >= 1000) return '$' + (n/1000).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}
function fmtFull(n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtPct(p) { if (p === null || p === undefined) return '—'; if (p >= 999) return 'NEW'; return (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; }
function pctClass(p) { if (p === null || p === undefined) return 'mom-flat'; if (p >= 999) return 'mom-up'; return p > 0 ? 'mom-up' : p < 0 ? 'mom-down' : 'mom-flat'; }

function renderAll() {
  renderTabs(); renderKPIs();
  try { renderTrend(); } catch(e) { console.warn('Trend chart unavailable:', e.message); showTrendFallback(); }
  renderDonut(); renderDept(); renderTopApps(); renderMovers(); renderTable();
  document.getElementById('updated').textContent = 'Updated ' + DATA.meta.lastUpdated;
  document.getElementById('footer').textContent =
    'Jan–Mar totals from App spend totals tab · classification from SaaS Apps Classification tab · April from Apr 26 Spend tab';
}

function renderTabs() {
  document.getElementById('month-tabs').innerHTML = ML().map((l,i) =>
    `<button class="month-tab ${i===activeMonth?'active':''}" onclick="setMonth(${i})">${l}</button>`).join('');
}
function setMonth(i) { activeMonth = i; renderTabs(); renderKPIs(); renderDonut(); renderDept(); renderTopApps(); }

function renderKPIs() {
  const mt = DATA.monthly[activeMonth];
  const prev = activeMonth > 0 ? DATA.monthly[activeMonth-1] : null;
  const mom = prev ? ((mt.total - prev.total)/prev.total*100) : null;
  const ytd = DATA.monthly.slice(0, activeMonth+1).reduce((s,m)=>s+m.total,0);
  let dir = 'flat';
  if (mom !== null) dir = mom > 0.05 ? 'up' : (mom < -0.05 ? 'down' : 'flat');
  const cogsPct = mt.total ? (mt.cogs/mt.total*100) : 0;
  const ncPct = mt.total ? (mt.nonCogs/mt.total*100) : 0;

  const cards = [
    `<div class="card">
       <div class="kpi-label">Total Spend · ${ML()[activeMonth]}</div>
       <div class="kpi-value num">${fmt(mt.total)}</div>
       <div class="kpi-sub num">${fmtFull(mt.total)}</div>
       <div class="kpi-foot">${mom!==null?`<span class="chip ${dir}">${fmtPct(mom)} MoM</span>`:''}</div>
     </div>`,
    `<div class="card">
       <div class="kpi-label">YTD Spend</div>
       <div class="kpi-value num">${fmt(ytd)}</div>
       <div class="kpi-sub num">${fmtFull(ytd)}</div>
       <div class="kpi-meter"><span style="width:100%;background:var(--noncogs)"></span></div>
     </div>`,
    `<div class="card">
       <div class="kpi-label">COGS</div>
       <div class="kpi-value num">${fmt(mt.cogs)}</div>
       <div class="kpi-sub num">${cogsPct.toFixed(1)}% of total</div>
       <div class="kpi-meter"><span style="width:${cogsPct.toFixed(0)}%;background:var(--cogs)"></span></div>
     </div>`,
    `<div class="card">
       <div class="kpi-label">Non-COGS</div>
       <div class="kpi-value num">${fmt(mt.nonCogs)}</div>
       <div class="kpi-sub num">${ncPct.toFixed(1)}% of total</div>
       <div class="kpi-meter"><span style="width:${ncPct.toFixed(0)}%;background:var(--noncogs)"></span></div>
     </div>`,
  ];
  document.getElementById('kpis').innerHTML = cards.join('');
}

let trendChart = null;
function showTrendFallback() {
  const wrap = document.getElementById('trend-wrap');
  wrap.innerHTML = '<div style="display:flex;align-items:flex-end;gap:18px;height:100%;padding:10px 0 28px">' +
    DATA.monthly.map((m,i)=>{
      const max = Math.max(...DATA.monthly.map(x=>x.total));
      const hC = (m.cogs/max*180), hN = (m.nonCogs/max*180);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:100%;max-width:60px;display:flex;flex-direction:column;justify-content:flex-end;height:200px">
          <div style="background:#0e9f6e;height:${hN}px;border-radius:4px 4px 0 0"></div>
          <div style="background:#3366d6;height:${hC}px"></div>
        </div>
        <span style="font-family:var(--mono);font-size:11px;color:var(--ink2)">${DATA.meta.monthLabels[i]}</span>
        <span style="font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:600">${fmt(m.total)}</span>
      </div>`;
    }).join('') + '</div>';
}
function renderTrend() {
  if (typeof Chart === 'undefined') throw new Error('Chart.js not loaded');
  const ctx = document.getElementById('trend').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ML(),
      datasets: [
        { label: 'COGS', data: DATA.monthly.map(m=>m.cogs), backgroundColor: COL.cogs, borderRadius: 5, stack: 'a', barPercentage: 0.62, categoryPercentage: 0.7 },
        { label: 'Non-COGS', data: DATA.monthly.map(m=>m.nonCogs), backgroundColor: COL.noncogs, borderRadius: 5, stack: 'a', barPercentage: 0.62, categoryPercentage: 0.7 },
        { label: 'Total', data: DATA.monthly.map(m=>m.total), type: 'line', borderColor: COL.amber, backgroundColor: COL.amber, pointBackgroundColor: '#fff', pointBorderColor: COL.amber, pointBorderWidth: 2, pointRadius: 4, borderWidth: 2, tension: 0.35 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: COL.ink2, font: { family: 'IBM Plex Sans', size: 12 }, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle', padding: 16 } },
        tooltip: {
          backgroundColor: '#fff', titleColor: '#1a1d26', bodyColor: '#5b6472', borderColor: '#e6e8ec', borderWidth: 1,
          padding: 12, titleFont: { family: 'IBM Plex Sans', weight: '600' }, bodyFont: { family: 'IBM Plex Mono' },
          callbacks: { label: c => '  ' + c.dataset.label + ':  ' + fmtFull(c.raw) }
        }
      },
      scales: {
        x: { stacked: true, ticks: { color: COL.ink2, font: { family: 'IBM Plex Mono', size: 12 } }, grid: { display: false }, border: { color: '#e6e8ec' } },
        y: { stacked: true, ticks: { color: COL.ink2, font: { family: 'IBM Plex Mono', size: 11 }, callback: v => fmt(v) }, grid: { color: COL.grid }, border: { display: false } }
      }
    }
  });
}

function renderDonut() {
  const mt = DATA.monthly[activeMonth];
  const total = mt.total || 1;
  const cogsPct = (mt.cogs/total*100), ncPct = (mt.nonCogs/total*100);
  const r = 56, cx = 75, cy = 75, sw = 18, circ = 2*Math.PI*r;
  const cogsDash = mt.cogs/total*circ;
  document.getElementById('donut-title').textContent = 'COGS Split · ' + ML()[activeMonth];
  document.getElementById('donut-area').innerHTML = `
    <svg id="donut-svg" viewBox="0 0 150 150">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${COL.noncogs}" stroke-width="${sw}" stroke-dasharray="${circ} ${circ}" transform="rotate(-90 ${cx} ${cy})"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${COL.cogs}" stroke-width="${sw}" stroke-dasharray="${cogsDash} ${circ}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
      <text x="${cx}" y="${cy-3}" text-anchor="middle" fill="#1a1d26" font-family="Archivo" font-size="19" font-weight="700">${fmt(total)}</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#8b93a1" font-family="IBM Plex Mono" font-size="10" letter-spacing="1">TOTAL</text>
    </svg>
    <div class="legend">
      <div class="legend-item"><span class="sw" style="background:${COL.cogs}"></span>COGS<span class="val num">${cogsPct.toFixed(1)}% · ${fmt(mt.cogs)}</span></div>
      <div class="legend-item"><span class="sw" style="background:${COL.noncogs}"></span>Non-COGS<span class="val num">${ncPct.toFixed(1)}% · ${fmt(mt.nonCogs)}</span></div>
    </div>`;
}

function renderDept() {
  const map = {};
  DATA.apps.forEach(a => { const v = a.spend[activeMonth]; if (v > 0) map[a.dept] = (map[a.dept]||0) + v; });
  const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max = sorted[0]?.[1] || 1;
  document.getElementById('dept-title').textContent = 'Spend by Department · ' + ML()[activeMonth];
  document.getElementById('dept').innerHTML = sorted.length ? sorted.map(([d,v]) => `
    <div class="dept-row">
      <div class="dept-top"><span class="nm">${d}</span><span class="amt num">${fmt(v)}</span></div>
      <div class="dept-track"><div class="dept-fill" style="width:${(v/max*100).toFixed(1)}%"></div></div>
    </div>`).join('') : '<div style="color:var(--ink3);font-size:13px">No data for this month</div>';
}

function renderTopApps() {
  const apps = DATA.apps.filter(a=>a.spend[activeMonth]>0).sort((a,b)=>b.spend[activeMonth]-a.spend[activeMonth]).slice(0,15);
  const max = apps[0]?.spend[activeMonth] || 1;
  document.getElementById('top-title').textContent = 'Top Apps · ' + ML()[activeMonth];
  document.getElementById('top-apps').innerHTML = `
    <div class="ta-head"><div>#</div><div>App</div><div>Type</div><div style="text-align:right">Amount</div><div>Share</div><div style="text-align:right">MoM</div></div>
    ${apps.map((a,i)=>{
      const v = a.spend[activeMonth], mom = a.mom[activeMonth];
      return `<div class="ta-row">
        <div class="ta-rank">${i+1}</div>
        <div class="ta-name" title="${a.name}">${a.name}</div>
        <div><span class="pill ${a.cogs?'cogs':'nc'}">${a.cogs?'COGS':'NC'}</span>${a.journaled?'<span class="pill je">JE</span>':''}</div>
        <div class="ta-amt num">${fmtFull(v)}</div>
        <div class="ta-bar-track"><div class="ta-bar" style="width:${(v/max*100).toFixed(1)}%"></div></div>
        <div class="ta-mom num ${pctClass(mom)}">${fmtPct(mom)}</div>
      </div>`;
    }).join('')}`;
}

function renderMovers() {
  document.getElementById('movers').innerHTML = DATA.movers.slice(0,12).map(m => {
    const isNew = m.prev === 0 || m.pct >= 999;
    const cls = isNew ? 'new' : (m.pct > 0 ? 'up' : 'down');
    return `<div class="mv">
      <span class="mv-name">${m.name}</span>
      <span class="mv-flow num">${fmt(m.prev)} → ${fmt(m.curr)}</span>
      <span class="mv-pct ${cls}">${isNew?'NEW':fmtPct(m.pct)}</span>
    </div>`;
  }).join('');
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
  renderTable();
}

function renderTable() {
  const cols = ['Name','Classification','Department','Journaled','Jan','Feb','Mar','Apr','YTD'];
  document.getElementById('thead').innerHTML = cols.map(c=>`<th onclick="sortTable('${c}')">${c} ${sortKey===c?(sortAsc?'↑':'↓'):''}</th>`).join('');
  let apps = DATA.apps.filter(a=>{
    if (!a.spend.some(s=>s>0)) return false;
    if (tableFilter && !a.name.toLowerCase().includes(tableFilter)) return false;
    if (activeFilter === 'cogs') return a.cogs;
    if (activeFilter === 'noncogs') return !a.cogs;
    if (activeFilter === 'journaled') return a.journaled;
    return true;
  });
  apps.sort((a,b)=>{
    let va, vb;
    if (sortKey==='Name') { va=a.name.toLowerCase(); vb=b.name.toLowerCase(); }
    else if (sortKey==='Classification') { va=a.cogs?1:0; vb=b.cogs?1:0; }
    else if (sortKey==='Department') { va=a.dept; vb=b.dept; }
    else if (sortKey==='Journaled') { va=a.journaled?1:0; vb=b.journaled?1:0; }
    else if (sortKey==='YTD') { va=a.spend.reduce((s,v)=>s+v,0); vb=b.spend.reduce((s,v)=>s+v,0); }
    else { const i=['Jan','Feb','Mar','Apr'].indexOf(sortKey); va=a.spend[i]; vb=b.spend[i]; }
    if (va<vb) return sortAsc?-1:1; if (va>vb) return sortAsc?1:-1; return 0;
  });
  document.getElementById('count').textContent = apps.length + ' apps';
  document.getElementById('tbody').innerHTML = apps.map(a=>{
    const ytd = a.spend.reduce((s,v)=>s+v,0);
    return `<tr>
      <td style="font-weight:500">${a.name}</td>
      <td><span class="pill ${a.cogs?'cogs':'nc'}">${a.cogs?'COGS':'Non-COGS'}</span></td>
      <td class="dept-cell">${a.dept}</td>
      <td><span class="pill ${a.journaled?'je':''}" style="${a.journaled?'':'color:var(--ink3);background:var(--bg)'}">${a.journaled?'Yes':'No'}</span></td>
      <td class="num-cell">${a.spend[0]>0?fmtFull(a.spend[0]):'—'}</td>
      <td class="num-cell">${a.spend[1]>0?fmtFull(a.spend[1]):'—'}</td>
      <td class="num-cell">${a.spend[2]>0?fmtFull(a.spend[2]):'—'}</td>
      <td class="num-cell">${a.spend[3]>0?fmtFull(a.spend[3]):'—'}</td>
      <td class="ytd-cell">${fmtFull(ytd)}</td>
    </tr>`;
  }).join('');
}

function sortTable(k) { if (sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=false; } renderTable(); }

document.addEventListener('DOMContentLoaded', ()=>{
  const s = document.getElementById('search');
  if (s) s.addEventListener('input', e=>{ tableFilter = e.target.value.toLowerCase(); renderTable(); });
  init();
});
</script>
</body>
</html>
